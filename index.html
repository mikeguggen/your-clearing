{id:2,theme:"Presence · 002",date:"June 2026",
cards:[
{type:"quote",
 front:{content:'"Nusquam est qui ubique est."\n\n"One who is everywhere is nowhere."',label:"on presence",attributed:true,author:"Seneca"},
 back:{content:"Every tab open. Every feed refreshed. Every room you're half-present in.\n\nHe wrote this two thousand years ago. It has not aged a day.\n\nYou don't have to be everywhere.\nYou just have to be here.",label:"sit with this",emphasisLines:["You don't have to be everywhere.","You just have to be here."]}
},
{type:"question",content:"Think of a moment when you were fully present.\n\nWhat did that feel like, and what got you there?",label:"reflect"}
]}
,
{id:1,theme:"Being Enough · 001",date:"June 2026",
cards:[
{type:"quote",
 front:{content:"The scoreboard in your head keeps a score nobody else is tracking.",label:"being enough",attributed:false},
 back:{content:"Most of the pressure you carry was never assigned to you. You picked it up somewhere along the way.\n\nYou decide what to pick up.\nYou decide what to put down.",label:"sit with this",emphasisLines:["You decide what to pick up.","You decide what to put down."]}
},
{type:"question",content:"If you could clear the scoreboard right now \u2014\n\nwhat would you let go of first?",label:"reflect"},
{type:"question",content:"What would be on your scoreboard \u2014\n\nthe one you actually wrote?",label:"your turn"}
]}
];

var styles = `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --cream:#f5f3ef; --cream-dark:#ede9e1;
    --gold:#c9a84c; --gold-light:#e8c97a;
    --ink:#1c1a16; --ink-soft:#4a4438; --ink-faint:#7a7060;
    --card-navy:#0f1e2e; --card-navy2:#132435; --card-question:#e8dfc8;
  }
  body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .site{min-height:100vh;display:flex;flex-direction:column;}
  .header{padding:52px 32px 36px;text-align:center;}
  .header::after{content:'';display:block;width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto 0;}
  .header-eyebrow{font-family:'Jost',sans-serif;font-weight:500;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
  .header-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:48px;line-height:1.15;color:#0f1e2e;}
  .header-sub{font-family:'Jost',sans-serif;font-weight:400;font-size:14px;color:var(--ink-soft);margin-top:14px;letter-spacing:0.05em;font-style:italic;}
  .gallery{flex:1;padding:36px 24px 80px;display:flex;flex-direction:column;gap:32px;max-width:480px;margin:0 auto;width:100%;}
  .deck-wrapper{cursor:pointer;position:relative;padding-bottom:14px;}
  .deck-wrapper::before{content:'';position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:calc(100% - 10px);height:calc(100% - 14px);border-radius:16px;background:#ddd8ce;border:1px solid rgba(15,30,46,0.1);z-index:0;}
  .deck-wrapper::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:calc(100% - 22px);height:calc(100% - 14px);border-radius:16px;background:#d4cfc4;border:1px solid rgba(15,30,46,0.07);z-index:-1;}
  .deck-card{background:#ffffff;border-radius:16px;padding:28px;position:relative;z-index:1;border:1px solid rgba(15,30,46,0.12);box-shadow:0 2px 20px rgba(15,30,46,0.07);transition:transform 0.2s ease,box-shadow 0.2s ease;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .deck-wrapper:hover .deck-card{transform:translateY(-3px);box-shadow:0 8px 32px rgba(15,30,46,0.12);}
  .deck-info{flex:1;}
  .deck-theme{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:#0f1e2e;margin-bottom:5px;}
  .deck-meta{font-family:'Jost',sans-serif;font-weight:400;font-size:11px;color:#4a6275;letter-spacing:0.14em;text-transform:uppercase;}
